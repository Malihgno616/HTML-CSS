<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      table {
        width: 400px;
        height: 400px;
        border-collapse: collapse; /* novo parâmetro */
      }

      td {
        padding: 8px;
        border: 1px solid black;
        text-align: center; /*Alinhamento horizontal*/
        vertical-align: middle; /* Alinmhamento vertical*/
      }

      .numero {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Minha primeira tabela</h1>
    <!-- 
        HIERARQUIA DE TABELAS (simples)
        table = tabela
          table row (<tr></tr>) = linha de tabela
            table header (<th></th>) = cabeçalho de tabela
            table data (<td></td>)= dado de tabela

            Tags de fechamento opcionais:
              <tr> (linha da tabela)
              <td> (célula de dados da tabela)
              <th> (célula de cabeçalho da tabela)
              <thead> (cabeçalho da tabela)
              <tbody> (corpo da tabela)
              <tfoot> (rodapé da tabela) 
    -->
    <table>
      <tr>
        <!-- primeira linha-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>

      <tr class="linha">
        <!-- segunda linha-->
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>
      </tr>

      <tr>
        <!-- terceira linha-->
        <td>A3</td>
        <td>B3</td>
        <td class="numero">C3</td>
      </tr>

      <tr>
        <!-- quarta linha-->
        <td>A4</td>
        <td class="dado">B4</td>
        <td>C4</td>
      </tr>
    </table>
  </body>
</html>
